syntax = "proto3";

package proto;

option go_package = "mitra/internal/proto";

message Repo {
  string id = 1;
  string url = 2;
  string host = 3;
  string owner = 4;
  string repo = 5;
  string main_branch = 6;
}

message Worktree {
  string id = 1;
  string repo_id = 2;
  string branch = 3;
  string path = 4;
  bool is_main = 5;
  optional string parent_branch = 6;
  string status = 7;  // "Clean" or dirty reason (e.g., "uncommitted_changes")
}

message Session {
  string id = 1;
  string worktree_id = 2;
  string name = 3;
}

service MitraService {
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc AddRepo(AddRepoRequest) returns (AddRepoResponse);
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  rpc AddWorktree(AddWorktreeRequest) returns (AddWorktreeResponse);
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);
  rpc DeleteWorktree(DeleteWorktreeRequest) returns (DeleteWorktreeResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message AddRepoRequest {
  string url = 1;
}

message AddRepoResponse {
  Repo repo = 1;
}

message DeleteRepoRequest {
  string repo_id = 1;
}

message DeleteRepoResponse {
  bool success = 1;
  string message = 2;
}

message AddWorktreeRequest {
  string repo_id = 1;
  optional string branch = 2;
  optional string parent_branch = 3;
}

message AddWorktreeResponse {
  Worktree worktree = 1;
}

message ListWorktreesRequest {
  string repo_id = 1;
}

message ListWorktreesResponse {
  repeated Worktree worktrees = 1;
}

message DeleteWorktreeRequest {
  string worktree_id = 1;
  bool force = 2;
}

message DeleteWorktreeResponse {
  bool success = 1;
  string message = 2;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}
